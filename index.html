<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17324d">
<meta name="description" content="端末内で管理する個人用資産管理アプリ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="stylesheet" href="./style.css">
<title>個人資産管理</title>
</head>
<body>
<header>
  <div class="header-main-row">
    <div>
      <h1>個人資産管理</h1>
      <p>個人用・端末内保存</p>
    </div>
    <div class="header-menu-wrap">
      <button type="button" id="header-menu-button" class="header-menu-button" aria-expanded="false" aria-controls="header-menu">メニュー</button>
      <div id="header-menu" class="header-menu" hidden>
        <button type="button" data-menu-action="open-data">データ管理</button>
      </div>
    </div>
  </div>
</header>

<main id="app">
  <div class="notice">読み込み中...</div>
</main>

<nav class="bottom-nav" aria-label="メインメニュー">
  <button type="button" data-tab="home" class="active">ホーム</button>
  <button type="button" data-tab="fx">FX</button>
  <button type="button" data-tab="stock">株式</button>
  <button type="button" data-tab="crypto">暗号資産</button>
  <button type="button" data-tab="bank">銀行</button>
</nav>

<script src="./js/core.js" defer></script>
<script src="./js/storage.js" defer></script>
<script src="./js/ui-common.js" defer></script>
<script src="./js/ui-home.js" defer></script>
<script src="./js/ui-accounts.js" defer></script>
<script src="./js/ui-data.js" defer></script>
<script src="./js/main.js" defer></script>
</body>
</html>
